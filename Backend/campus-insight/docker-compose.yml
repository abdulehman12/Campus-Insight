version: '3.8'

# Development Docker Compose Configuration
# Run with: docker-compose up -d
# For production, use: docker-compose -f docker-compose.prod.yml up -d

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: campus-insight-db-dev
    environment:
      POSTGRES_USER: Abdul Rehman
      POSTGRES_PASSWORD: 1156455
      POSTGRES_DB: campus_insight
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Abdul Rehman"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # pgAdmin - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus-insight-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: abdulrehman@hotmail.com
      PGADMIN_DEFAULT_PASSWORD: 1156455
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # NestJS Backend Application (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: campus-insight-backend-dev
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-campus_insight}
      PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - campus-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  campus-network:
    driver: bridge
