version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: campus-insight-db-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - campus-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # pgAdmin - PostgreSQL Management Tool
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus-insight-pgadmin-prod
    environment:
      PGADMIN_DEFAULT_EMAIL: abdulrehman12@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - campus-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # NestJS Backend Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: campus-insight-backend-prod
    environment:
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      PORT: 3000
    ports:
      - "5000:3000"
    networks:
      - campus-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  campus-network:
    driver: bridge
